name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # Minimum CI/CD gate: the build must compile, lint clean, and typecheck clean.
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint-config-next)
        run: npm run lint

      - name: Typecheck (tsc --noEmit, strict mode)
        run: npm run typecheck

      # Unlike qr-menu-dev, no placeholder env vars are injected here: this
      # project has no NEXT_PUBLIC_* value that's read at build time without
      # a safe fallback (specs/002-authjs-authorization's NEXT_PUBLIC_SITE_URL
      # falls back to localhost; DATABASE_URL/AUTH_SECRET are read at request
      # time inside server-only modules, not needed to produce a build).
      - name: Build (Next.js production build)
        run: npm run build

  # Coding conventions for this tech stack + alignment with the project spec.
  conventions:
    name: Coding conventions & spec alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Structure & spec-alignment check
        run: node .github/scripts/check-structure.mjs

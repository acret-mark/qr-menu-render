# Render Blueprint (specs/001-render-hosting-cutover, T004/T005).
#
# Declares both staging and production as separate services/databases in one
# file — one source of truth applied to both, per Constitution Principle VII
# (parity derived from one place, not clicked together twice by hand and
# risking drift). Plan values below are the real paid target
# (specs/001-render-hosting-cutover FR-001a); the free-tier feasibility POC
# (specs/003-render-feasibility-poc) does NOT edit this file — it applies a
# generated copy with `plan: free` overrides instead (see that spec's
# research.md), so this file always reflects the actual target
# configuration, not a temporary experiment.
#
# Secrets shared between a Web Service and its own Cron Jobs (CRON_SECRET,
# so the cron caller's bearer token actually matches what the route expects)
# live in an envVarGroup per environment, not `generateValue` on each
# service independently — two independently generated values would never
# match each other.

envVarGroups:
  - name: qr-menu-render-staging-secrets
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # staging URL, set per-environment
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false

  - name: qr-menu-render-production-secrets
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # production domain, set once cutover happens (Phase 5)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false

services:
  - type: web
    name: qr-menu-render-staging
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVarGroups:
      - qr-menu-render-staging-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-staging-db
          property: connectionString
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

  - type: web
    name: qr-menu-render-production
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVarGroups:
      - qr-menu-render-production-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-production-db
          property: connectionString
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

databases:
  - name: qr-menu-render-staging-db
    plan: basic
    region: singapore

  - name: qr-menu-render-production-db
    plan: basic
    region: singapore

# Cron Jobs (specs/001-render-hosting-cutover T011/T012) — same schedule and
# route contract as qr-menu-dev's vercel.json, verified directly against it
# (Constitution Principle VII), not re-derived from the migration plan alone.
# One pair per environment, sharing that environment's envVarGroup so
# CRON_SECRET matches the Web Service's copy.
crons:
  - name: qr-menu-render-staging-payment-reminders
    runtime: node
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-staging-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-staging.onrender.com/api/cron/payment-reminders

  - name: qr-menu-render-staging-subscription-expiry
    runtime: node
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-staging-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-staging.onrender.com/api/cron/subscription-expiry

  - name: qr-menu-render-production-payment-reminders
    runtime: node
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-production-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-production.onrender.com/api/cron/payment-reminders

  - name: qr-menu-render-production-subscription-expiry
    runtime: node
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-production-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-production.onrender.com/api/cron/subscription-expiry

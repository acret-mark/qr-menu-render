# Render Blueprint (specs/001-render-hosting-cutover, T004/T005).
#
# Declares both staging and production as separate services/databases in one
# file — one source of truth applied to both, per Constitution Principle VII
# (parity derived from one place, not clicked together twice by hand and
# risking drift). Plan values below are the real paid target
# (specs/001-render-hosting-cutover FR-001a); the free-tier interim
# deployment (specs/003-render-feasibility-poc) lives on its own
# `render-free-interim` branch instead of editing this file, so this file
# always reflects the actual target configuration, not the interim state.
#
# Corrected twice against Render's real Blueprint validation (2026-09-11):
# 1. No top-level `crons:` key — cron jobs are `services:` entries with
#    `type: cron`, same shape as `type: web`.
# 2. No `envVarGroups:` reference at the service level (that field only
#    exists inside the `projects:`/`environments:` grouping structure, which
#    this flat Blueprint doesn't use). Cross-service secret sharing
#    (CRON_SECRET, so a Cron Job's bearer token matches what its Web
#    Service expects) uses `fromService` instead — see the cron entries
#    below. Each cron job only declares CRON_SECRET; it has no other reason
#    to need DATABASE_URL, GMAIL_SMTP_*, etc., since it's just a `curl` call
#    against its Web Service, not a process that touches those services
#    itself.

services:
  - type: web
    name: qr-menu-render-staging
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-staging-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # staging URL, set per-environment
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

  - type: web
    name: qr-menu-render-production
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-production-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # production domain, set once cutover happens (Phase 5)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

  # Cron Jobs (specs/001-render-hosting-cutover T011/T012) — same schedule
  # and route contract as qr-menu-dev's vercel.json, verified directly
  # against it (Constitution Principle VII), not re-derived from the
  # migration plan alone. Each just curls its own environment's Web Service.
  - type: cron
    name: qr-menu-render-staging-payment-reminders
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-staging
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-staging.onrender.com/api/cron/payment-reminders

  - type: cron
    name: qr-menu-render-staging-subscription-expiry
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-staging
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-staging.onrender.com/api/cron/subscription-expiry

  - type: cron
    name: qr-menu-render-production-payment-reminders
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-production
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-production.onrender.com/api/cron/payment-reminders

  - type: cron
    name: qr-menu-render-production-subscription-expiry
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-production
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-production.onrender.com/api/cron/subscription-expiry

databases:
  - name: qr-menu-render-staging-db
    plan: basic
    region: singapore

  - name: qr-menu-render-production-db
    plan: basic
    region: singapore

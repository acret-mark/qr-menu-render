# Render Blueprint — FREE-TIER INTERIM DEPLOYMENT.
#
# specs/003-render-feasibility-poc, reversed 2026-09-11 (see that spec's
# Clarifications): with no company budget currently secured, this is no
# longer a disposable proof-of-concept — it's the project's actual interim
# environment until render.yaml's paid target can be funded. See
# docs/known-limitations.md for what that tradeoff actually costs.
#
# Generated from render.yaml with plan values swapped to `free` — kept as a
# SEPARATE file rather than editing render.yaml in place, so render.yaml
# always reflects the real target configuration (Constitution Principle
# VII), not this interim state. When budget is approved, switch to applying
# render.yaml directly and retire this file.
#
# Render's free Postgres is NOT a permanent tier — it expires and is
# deleted (~30 days), unlike a paid instance. Recreating it periodically is
# an accepted, recurring operational cost of staying on this file — see
# docs/known-limitations.md for the recreation steps.
#
# Corrected 2026-09-11 (first real Render Blueprint validation attempt):
# there is no top-level `crons:` key in Render's Blueprint schema — cron
# jobs are `services:` entries with `type: cron`, same as `type: web`.

envVarGroups:
  - name: qr-menu-render-interim-secrets
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false

services:
  - type: web
    name: qr-menu-render-interim
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVarGroups:
      - qr-menu-render-interim-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-interim-db
          property: connectionString
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

  # Cron Jobs also run on the free plan here — a much smaller compromise
  # than the Web Service/Postgres free tiers above.
  - type: cron
    name: qr-menu-render-interim-payment-reminders
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-interim-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-interim.onrender.com/api/cron/payment-reminders

  - type: cron
    name: qr-menu-render-interim-subscription-expiry
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVarGroups:
      - qr-menu-render-interim-secrets
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-interim.onrender.com/api/cron/subscription-expiry

databases:
  - name: qr-menu-render-interim-db
    plan: free
    region: singapore

# Render Blueprint — FREE-TIER INTERIM DEPLOYMENT.
#
# specs/003-render-feasibility-poc, reversed 2026-09-11 (see that spec's
# Clarifications): with no company budget currently secured, this is no
# longer a disposable proof-of-concept — it's the project's actual interim
# environment until render.yaml's paid target (on the `main` branch) can be
# funded. See docs/known-limitations.md for what that tradeoff actually
# costs.
#
# This branch's render.yaml intentionally diverges from main's — main is
# the real paid target; this is the interim substitute, kept on its own
# branch so Render's Blueprint scanner finds a standard render.yaml here
# without touching main's.
#
# Corrected twice against Render's real Blueprint validation (2026-09-11):
# 1. No top-level `crons:` key — cron jobs are `services:` entries with
#    `type: cron`, same shape as `type: web`.
# 2. No `envVarGroups:` reference at the service level (only works inside
#    the `projects:`/`environments:` grouping structure, unused here).
#    CRON_SECRET is shared via `fromService` instead — each cron job pulls
#    it straight from the Web Service, and carries no other env var it
#    doesn't actually need (it's just a `curl` call, not a process that
#    touches the database or any other secret itself).

services:
  - type: web
    name: qr-menu-render-interim
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-interim-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

  # Cron Jobs also run on the free plan here — a much smaller compromise
  # than the Web Service/Postgres free tiers above.
  - type: cron
    name: qr-menu-render-interim-payment-reminders
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-interim
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-interim.onrender.com/api/cron/payment-reminders

  - type: cron
    name: qr-menu-render-interim-subscription-expiry
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    schedule: "0 9 * * *"
    buildCommand: npm ci
    envVars:
      - key: CRON_SECRET
        fromService:
          name: qr-menu-render-interim
          property: envVarKey
          envVarKey: CRON_SECRET
    startCommand: >-
      curl -sf -H "Authorization: Bearer $CRON_SECRET"
      https://qr-menu-render-interim.onrender.com/api/cron/subscription-expiry

databases:
  - name: qr-menu-render-interim-db
    plan: free
    region: singapore

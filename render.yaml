# Render Blueprint — FREE-TIER INTERIM DEPLOYMENT.
#
# specs/003-render-feasibility-poc, reversed 2026-09-11 (see that spec's
# Clarifications): with no company budget currently secured, this is no
# longer a disposable proof-of-concept — it's the project's actual interim
# environment until render.yaml's paid target (on the `main` branch) can be
# funded. See docs/known-limitations.md for what that tradeoff actually
# costs.
#
# This branch's render.yaml intentionally diverges from main's — main is
# the real paid target; this is the interim substitute, kept on its own
# branch so Render's Blueprint scanner finds a standard render.yaml here
# without touching main's.
#
# Corrected three times against Render's real Blueprint validation
# (2026-09-11):
# 1. No top-level `crons:` key — cron jobs are `services:` entries with
#    `type: cron`.
# 2. No `envVarGroups:` reference at the service level.
# 3. **Cron Jobs have no free plan on Render** — confirmed by Render's live
#    validator ("free not a valid plan for service type cron"), contradicting
#    what Render's own docs summary suggested. Rather than pay for cron on an
#    otherwise-free interim deployment, the two scheduled jobs
#    (payment-reminders, subscription-expiry) are simply NOT deployed here —
#    see docs/known-limitations.md, which documents this as a real, current
#    gap: those two jobs do not run against this environment at all.
#    CRON_SECRET is dropped too — nothing on this branch calls those routes.
# 4. Render's build sets NODE_ENV=production, which makes plain `npm ci`
#    skip devDependencies — `next build` needs `@tailwindcss/postcss` from
#    that list, so it failed immediately ("Cannot find module
#    '@tailwindcss/postcss'"). `buildCommand` now forces
#    `npm ci --include=dev`; verified locally (reproduced the failure,
#    then confirmed the fix builds clean) before pushing.

services:
  - type: web
    name: qr-menu-render-interim
    runtime: node
    plan: free
    region: singapore
    branch: render-free-interim
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qr-menu-render-interim-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: PAYMENT_REMINDER_THRESHOLD_DAYS
        value: "3"
      - key: AI_DESCRIPTION_DAILY_LIMIT
        value: "10"

databases:
  - name: qr-menu-render-interim-db
    plan: free
    region: singapore
